apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: sqlinstances.gcp.platform.upbound.io
spec:
  scope: Namespaced
  group: gcp.platform.upbound.io
  names:
    kind: SQLInstance
    plural: sqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    managementPolicies:
                      description: "ManagementPolicies for resources. Defaults to [\"*\"] which includes all operations (Create, Observe, Update, Delete, LateInitialize). To orphan resources on deletion, use [\"Create\", \"Observe\", \"Update\", \"LateInitialize\"]."
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                      default: ["*"]
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    engine:
                      type: string
                      description: This SQLInstance engine
                      enum:
                        - postgres
                        - mysql
                    engineVersion:
                      type: string
                      description: This SQLInstance engine version
                    storageGB:
                      type: integer
                    passwordSecretRef:
                      type: object
                      description: "A reference to the Secret object containing database password. In v2, namespace is inferred from the resource namespace if not specified."
                      properties:
                        namespace:
                          type: string
                          description: "Optional - namespace is inferred from resource namespace in v2"
                        name:
                          type: string
                        key:
                          type: string
                      required:
                        - name
                        - key
                    networkRef:
                      type: object
                      description: "A reference to the Network object that this postgres should be
                      connected to. Set name, id, or both; name takes precedence."
                      properties:
                        id:
                          type: string
                          description: "ID of the Network object this ref points to: its
                          spec.parameters.id. Used only when name is unset, to find the
                          Network's network by its networks.gcp.platform.upbound.io/network-id
                          label."
                        name:
                          type: string
                          description: "Name of a Network in this namespace to connect to. When
                          set, the instance is wired from that Network's published
                          status.vpc, and its network resources are created once the
                          Network publishes its network's id and selfLink. When unset, the network is found by the
                          network-id label matching id, as before."
                      x-kubernetes-validations:
                        - rule: has(self.id) || has(self.name)
                          message: networkRef must set id or name
                  required:
                    - region
                    - storageGB
                    - networkRef
                    - passwordSecretRef
              required:
                - parameters
            status:
              type: object
              description: Published by the composition, for consumers of this SQLInstance.
              properties:
                connectionSecretRef:
                  type: object
                  description: "The Secret, in this namespace, holding the connection details:
                  host, serverCACertificateCert, username and password. It is created with
                  the SQLInstance and stays empty until the database user exists."
                  properties:
                    name:
                      type: string
                      description: Name of the connection Secret, <xr-name>-connection.
                address:
                  type: string
                  description: "Private IP address of the instance in the Network. Set once
                  Cloud SQL reports it, which is when the instance is reachable."
